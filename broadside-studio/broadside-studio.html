<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadside Studio — Binti Maringo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Archivo:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=Work+Sans:wght@400;500&display=swap">
<style>
  /* ---------- App chrome (never exported) ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: #E8E7E2;
    color: #171614;
    overflow: hidden;
  }

  /* Sidebar */
  aside {
    width: 326px; min-width: 326px; height: 100vh;
    background: #FBFAF7;
    border-right: 1px solid #DCDAD3;
    overflow-y: auto;
    padding: 22px 18px 48px;
  }
  aside header h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  aside header p {
    margin-top: 4px; font-size: 10px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: #939086;
  }
  .sec { margin-top: 26px; }
  .sec-title {
    font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: #6E6B62; margin-bottom: 9px;
  }
  button { font-family: inherit; cursor: pointer; }

  #layoutGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #layoutGrid button {
    aspect-ratio: 1; border: 1px solid #CECCC4; border-radius: 4px;
    background: #fff; font-size: 12px; font-weight: 600; color: #171614;
  }
  #layoutGrid button.active { background: #171614; color: #FBFAF7; border-color: #171614; }

  .rowbtns { display: flex; gap: 6px; margin-top: 8px; }
  .btn {
    flex: 1; padding: 8px 10px; font-size: 12px; font-weight: 600;
    border: 1px solid #CECCC4; border-radius: 4px; background: #fff; color: #171614;
  }
  .btn:hover { border-color: #171614; }
  .btn.primary { background: #171614; color: #FBFAF7; border-color: #171614; }

  .seg { display: flex; border: 1px solid #CECCC4; border-radius: 5px; overflow: hidden; background: #fff; }
  .seg button {
    flex: 1; padding: 8px 0; font-size: 12px; font-weight: 600;
    background: transparent; border: 0; border-left: 1px solid #CECCC4; color: #171614;
  }
  .seg button:first-child { border-left: 0; }
  .seg button.active { background: #171614; color: #FBFAF7; }

  .picker { display: flex; flex-direction: column; gap: 6px; }
  .picker button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    text-align: left; padding: 8px 10px;
    border: 1px solid #CECCC4; border-radius: 5px; background: #fff; color: #171614;
  }
  .picker button.active { border-color: #171614; box-shadow: inset 0 0 0 1px #171614; }
  .vname { font-size: 16px; line-height: 1.1; }
  .vsub { font-size: 10px; color: #939086; margin-top: 2px; }
  .swatch {
    width: 30px; height: 30px; min-width: 30px; border-radius: 4px;
    border: 1px solid rgba(0,0,0,0.18);
    display: flex; align-items: center; justify-content: center; position: relative;
    font-size: 12px; font-weight: 700;
  }
  .swatch i {
    position: absolute; right: 3px; bottom: 3px; width: 7px; height: 7px;
    border-radius: 50%; display: block;
  }
  .iname { font-size: 12px; font-weight: 600; }

  .field { margin-bottom: 10px; }
  .field label {
    display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: #6E6B62; margin-bottom: 4px;
  }
  .field textarea, .field input[type="text"] {
    width: 100%; font: 12px/1.5 Inter, system-ui, sans-serif;
    padding: 7px 9px; border: 1px solid #CECCC4; border-radius: 4px;
    background: #fff; color: #171614; resize: vertical;
  }
  .field textarea:focus, .field input:focus { outline: none; border-color: #171614; }

  #imgInput { font-size: 11px; width: 100%; }
  #imgNote { font-size: 10px; color: #939086; margin-top: 6px; line-height: 1.5; }

  /* Workspace */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  #stage {
    flex: 1; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #posterwrap { position: relative; }
  #poster { box-shadow: 0 18px 60px rgba(20,18,14,0.28), 0 2px 8px rgba(20,18,14,0.14); }

  footer {
    height: 54px; display: flex; align-items: center; gap: 8px;
    padding: 0 18px; border-top: 1px solid #DCDAD3; background: #FBFAF7;
  }
  #layoutLabel { font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
  #layoutLabel span { color: #939086; font-weight: 600; margin-right: 8px; }
  footer .grow { flex: 1; }
  footer .btn { flex: 0 0 auto; padding: 8px 14px; }
</style>
</head>
<body>

<aside>
  <header>
    <h1>Broadside Studio</h1>
    <p>Binti Maringo · Broadsides · Type · Grids</p>
  </header>

  <div class="sec">
    <div class="sec-title">Layout</div>
    <div id="layoutGrid"></div>
    <div class="rowbtns">
      <button class="btn" id="btnShuffleSide" type="button">Shuffle</button>
      <button class="btn" id="btnSurprise" type="button">Surprise</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">Canvas</div>
    <div class="seg" id="ratioSeg"></div>
  </div>

  <div class="sec">
    <div class="sec-title">Type Voice</div>
    <div class="picker" id="voiceList"></div>
  </div>

  <div class="sec">
    <div class="sec-title">Ink</div>
    <div class="picker" id="inkList"></div>
  </div>

  <div class="sec">
    <div class="sec-title">Content</div>
    <div id="fields"></div>
  </div>

  <div class="sec">
    <div class="sec-title">Image</div>
    <input type="file" id="imgInput" accept="image/*">
    <div class="rowbtns"><button class="btn" id="btnClearImg" type="button">Clear image</button></div>
    <div id="imgNote">No upload yet — using a generated placeholder in the active ink. Pure-type layouts ignore the image.</div>
  </div>
</aside>

<main>
  <div id="stage"><div id="posterwrap"></div></div>
  <footer>
    <div id="layoutLabel"></div>
    <div class="grow"></div>
    <button class="btn" id="btnPrev" type="button">‹ Prev</button>
    <button class="btn" id="btnNext" type="button">Next ›</button>
    <button class="btn" id="btnShuffle" type="button">Shuffle</button>
    <button class="btn primary" id="btnExport" type="button">Export PNG</button>
  </footer>
</main>

<script>
'use strict';

/* =========================================================
   DATA — voices, inks, ratios. Append an entry to extend.
   To add a local custom font later: declare @font-face in a
   <style> block (or this file's CSS), then reference the
   family name in a voice's `display` / `text` strings.
   Layouts only ever read the active voice — nothing else
   needs to change.
   ========================================================= */

const VOICES = [
  { name: 'The Grotesk',   display: "'Archivo Black', 'Archivo', sans-serif", displayWeight: '400', transform: 'uppercase',
    text: "'Inter', sans-serif",            displayLabel: 'Archivo Black',    textLabel: 'Inter' },
  { name: 'The Serif',     display: "'Playfair Display', serif",              displayWeight: '700', transform: 'none',
    text: "'Source Serif 4', serif",        displayLabel: 'Playfair Display', textLabel: 'Source Serif 4' },
  { name: 'The Wood Type', display: "'Anton', sans-serif",                    displayWeight: '400', transform: 'uppercase',
    text: "'IBM Plex Mono', monospace",     displayLabel: 'Anton',            textLabel: 'IBM Plex Mono' },
  { name: 'The Mono',      display: "'Space Mono', monospace",                displayWeight: '700', transform: 'uppercase',
    text: "'Space Mono', monospace",        displayLabel: 'Space Mono',       textLabel: 'Space Mono' },
  { name: 'The Eccentric', display: "'Syne', sans-serif",                     displayWeight: '800', transform: 'uppercase',
    text: "'Work Sans', sans-serif",        displayLabel: 'Syne',             textLabel: 'Work Sans' },
];

const INKS = [
  { name: 'Black / White', paper: '#0A0A0A', ink: '#F5F5F0', accent: '#F5F5F0' },
  { name: 'White / Black', paper: '#F5F5F0', ink: '#0A0A0A', accent: '#0A0A0A' },
  { name: 'Cream / Ink',   paper: '#EFE7D8', ink: '#1C1A16', accent: '#8A3324' },
  { name: 'The Doja',      paper: '#D4C227', ink: '#1A1410', accent: '#0C3934' },
  { name: 'Binti',         paper: '#F8EBEE', ink: '#1A1410', accent: '#0C3934' }, // locked brand tokens
];

const RATIOS = [
  { label: '3:4', w: 3, h: 4 },
  { label: 'A4',  w: 1, h: 1.414 },
  { label: '4:5', w: 4, h: 5 },
];

const W = 780;            // internal sheet width in px; height derives from ratio
const EXPORT_SCALE = 3;   // export multiplier (≥2x display size)
const M = 6;              // sheet margin in grid units (1 unit = 1% of width)

const state = {
  layout: 0, ratio: 0, voice: 0, ink: 0,
  image: null, // uploaded data URL, or null → generated placeholder
  content: {
    title:    'If We\nCould Bring It',
    headline: 'Toronto\nJune 15–26\n2026',
    metaA:    'Design\nWriting\nResearch\nPedagogy',
    metaB:    'Binti Maringo\nCultural Studio\nToronto',
    edition:  'No. 1 of 7',
    colophon: 'Binti Maringo — MMXXVI · Set in {display} & {text}',
  },
};

/* =========================================================
   HELPERS
   ========================================================= */

function dims() {
  const r = RATIOS[state.ratio];
  return { W, H: Math.round(W * r.h / r.w) };
}

// 1 unit = 1% of sheet width, via the --u custom property on the poster root.
function u(n) { return `calc(var(--u) * ${n})`; }

function hexAlpha(hex, a) {
  return hex + Math.round(a * 255).toString(16).padStart(2, '0');
}

function el(tag, style, ...kids) {
  const n = document.createElement(tag);
  if (style) for (const k in style) {
    if (k.startsWith('--')) n.style.setProperty(k, style[k]);
    else n.style[k] = style[k];
  }
  for (const kid of kids) if (kid != null && kid !== '') n.append(kid);
  return n;
}

function linesOf(t) {
  return String(t || '').split('\n').map(s => s.trim()).filter(s => s);
}

// Multi-line text → one div per line (keeps rag and breaks under author control)
function stack(text, style) {
  const d = el('div', style);
  for (const l of linesOf(text)) d.append(el('div', null, l));
  return d;
}

function colophonText(ctx) {
  return String(ctx.content.colophon || '')
    .replace(/\{display\}/g, ctx.voice.displayLabel)
    .replace(/\{text\}/g, ctx.voice.textLabel);
}

/* ---------- shared composition pieces (all colors from ink, all fonts from voice) ---------- */

function disp(ctx, text, size, extra) {
  return stack(text, Object.assign({
    fontFamily: ctx.voice.display, fontWeight: ctx.voice.displayWeight,
    textTransform: ctx.voice.transform, lineHeight: '0.95',
    letterSpacing: '-0.01em', fontSize: u(size),
  }, extra));
}

function meta(ctx, text, extra) {
  return stack(text, Object.assign({ fontSize: u(1.7), lineHeight: '1.55' }, extra));
}

function colo(ctx, extra) {
  return el('div', Object.assign({
    fontSize: u(1.4), letterSpacing: '0.04em', opacity: '0.85', lineHeight: '1.4',
  }, extra), colophonText(ctx));
}

function edit(ctx, extra) {
  return el('div', Object.assign({
    fontSize: u(1.7), color: ctx.ink.accent, fontWeight: '600',
    letterSpacing: '0.12em', textTransform: 'uppercase',
  }, extra), ctx.content.edition);
}

// Image area as a background div (more robust than <img> for PNG export)
function pic(ctx, style) {
  return el('div', Object.assign({
    backgroundImage: `url("${ctx.image}")`,
    backgroundSize: 'cover', backgroundPosition: 'center',
  }, style));
}

function rule(ctx, thick) {
  return el('div', { borderTop: `${thick ? u(0.9) : '1px'} solid ${ctx.ink.ink}` });
}

/* =========================================================
   PLACEHOLDER IMAGE — tiny canvas upscaled = free blur
   ========================================================= */

const phCache = {};
function placeholder(ink) {
  if (phCache[ink.name]) return phCache[ink.name];
  const c = document.createElement('canvas');
  c.width = 64; c.height = 80;
  const x = c.getContext('2d');
  x.fillStyle = ink.paper; x.fillRect(0, 0, 64, 80);
  let g = x.createRadialGradient(24, 28, 2, 24, 28, 52);
  g.addColorStop(0, ink.accent);
  g.addColorStop(1, hexAlpha(ink.accent, 0));
  x.fillStyle = g; x.fillRect(0, 0, 64, 80);
  g = x.createRadialGradient(54, 68, 2, 54, 68, 44);
  g.addColorStop(0, hexAlpha(ink.ink, 0.85));
  g.addColorStop(1, hexAlpha(ink.ink, 0));
  x.fillStyle = g; x.fillRect(0, 0, 64, 80);
  g = x.createRadialGradient(10, 70, 2, 10, 70, 30);
  g.addColorStop(0, hexAlpha(ink.accent, 0.6));
  g.addColorStop(1, hexAlpha(ink.accent, 0));
  x.fillStyle = g; x.fillRect(0, 0, 64, 80);
  return (phCache[ink.name] = c.toDataURL('image/png'));
}

/* =========================================================
   LAYOUTS — each is an independent template: receives
   { content, voice, ink, image, ratio, W, H } and returns
   a full-bleed DOM node. Inline-styled so export needs no
   external CSS. Append an entry to add a layout.
   ========================================================= */

const LAYOUTS = [

  /* 1 — Swiss skeleton, image band on top half */
  { name: 'The Masthead', render(ctx) {
    const r = el('div', { position: 'absolute', inset: '0' });
    r.append(
      pic(ctx, { position: 'absolute', left: '0', top: '0', width: '100%', height: '47%' }),
      edit(ctx, { position: 'absolute', right: u(M), top: '49%' }),
      disp(ctx, ctx.content.title, 11, { position: 'absolute', left: u(M), top: '53%', maxWidth: '82%' }),
      disp(ctx, ctx.content.headline, 2.8, { position: 'absolute', right: u(M), bottom: u(20), textAlign: 'right' }),
      meta(ctx, ctx.content.metaA, { position: 'absolute', left: u(M), bottom: u(8) }),
      meta(ctx, ctx.content.metaB, { position: 'absolute', right: u(M), bottom: u(8), textAlign: 'right' }),
      colo(ctx, { position: 'absolute', left: u(M), right: u(M), bottom: u(2.6),
                  borderTop: `1px solid ${ctx.ink.ink}`, paddingTop: u(1.2) })
    );
    return r;
  }},

  /* 2 — full-bleed image, massive centered headline */
  { name: 'The Monolith', render(ctx) {
    const p = ctx.ink.paper;
    const r = el('div', { position: 'absolute', inset: '0' });
    const mid = el('div', { position: 'absolute', inset: '0', display: 'flex',
                            alignItems: 'center', justifyContent: 'center', padding: u(4) });
    mid.append(disp(ctx, ctx.content.headline, 12, { textAlign: 'center', color: p }));
    const metas = el('div', { position: 'absolute', left: u(M), right: u(M), bottom: u(11),
                              display: 'flex', justifyContent: 'center', gap: u(8) });
    metas.append(
      meta(ctx, ctx.content.metaA, { textAlign: 'center', color: p, fontSize: u(1.55) }),
      meta(ctx, ctx.content.metaB, { textAlign: 'center', color: p, fontSize: u(1.55) })
    );
    r.append(
      pic(ctx, { position: 'absolute', inset: '0' }),
      el('div', { position: 'absolute', inset: '0', background: hexAlpha(ctx.ink.ink, 0.38) }),
      stack(ctx.content.title, { position: 'absolute', top: u(M), left: '0', right: '0',
        textAlign: 'center', color: p, fontSize: u(1.9), fontWeight: '600',
        letterSpacing: '0.3em', textTransform: 'uppercase', lineHeight: '1.7' }),
      mid, metas,
      el('div', { position: 'absolute', left: '0', right: '0', bottom: u(6.4), textAlign: 'center',
        color: p, fontSize: u(1.7), letterSpacing: '0.14em', textTransform: 'uppercase',
        fontWeight: '600' }, ctx.content.edition),
      colo(ctx, { position: 'absolute', left: '0', right: '0', bottom: u(2.6),
        textAlign: 'center', color: p })
    );
    return r;
  }},

  /* 3 — headline stepping diagonally, image bleeding into lower-left corner */
  { name: 'The Stair', render(ctx) {
    const r = el('div', { position: 'absolute', inset: '0' });
    const stair = el('div', { position: 'absolute', top: u(19), left: u(M), right: u(M) });
    linesOf(ctx.content.headline).forEach((l, i) => {
      stair.append(el('div', {
        fontFamily: ctx.voice.display, fontWeight: ctx.voice.displayWeight,
        textTransform: ctx.voice.transform, lineHeight: '1.02',
        letterSpacing: '-0.01em', fontSize: u(8.5), marginLeft: u(i * 9),
      }, l));
    });
    r.append(
      meta(ctx, ctx.content.metaA, { position: 'absolute', top: u(M), left: u(M) }),
      meta(ctx, ctx.content.metaB, { position: 'absolute', top: u(M), right: u(M), textAlign: 'right' }),
      stair,
      pic(ctx, { position: 'absolute', left: '0', bottom: '0', width: '44%', height: '30%' }),
      disp(ctx, ctx.content.title, 3.2, { position: 'absolute', right: u(M), bottom: u(13), textAlign: 'right' }),
      edit(ctx, { position: 'absolute', right: u(M), bottom: u(9.5) }),
      colo(ctx, { position: 'absolute', left: '48%', right: u(M), bottom: u(2.6) })
    );
    return r;
  }},

  /* 4 — image fills sheet, type knocked out */
  { name: 'The Full Bleed', render(ctx) {
    const p = ctx.ink.paper;
    const r = el('div', { position: 'absolute', inset: '0' });
    const metas = el('div', { position: 'absolute', left: u(M), bottom: u(8),
                              display: 'flex', gap: u(6) });
    metas.append(
      meta(ctx, ctx.content.metaA, { color: p, fontSize: u(1.55) }),
      meta(ctx, ctx.content.metaB, { color: p, fontSize: u(1.55) })
    );
    r.append(
      pic(ctx, { position: 'absolute', inset: '0' }),
      el('div', { position: 'absolute', inset: '0',
        background: `linear-gradient(180deg, ${hexAlpha(ctx.ink.ink, 0.4)} 0%, ${hexAlpha(ctx.ink.ink, 0)} 32%, ${hexAlpha(ctx.ink.ink, 0)} 55%, ${hexAlpha(ctx.ink.ink, 0.52)} 100%)` }),
      disp(ctx, ctx.content.title, 13, { position: 'absolute', top: u(M), left: u(M), maxWidth: '88%', color: p }),
      disp(ctx, ctx.content.headline, 3.8, { position: 'absolute', right: u(M), bottom: u(26), textAlign: 'right', color: p }),
      metas,
      edit(ctx, { position: 'absolute', right: u(M), bottom: u(2.6), color: p }),
      colo(ctx, { position: 'absolute', left: u(M), bottom: u(2.6), color: p, opacity: '0.95' })
    );
    return r;
  }},

  /* 5 — hard asymmetric split: narrow image column, wide type column */
  { name: 'The Column', render(ctx) {
    const r = el('div', { position: 'absolute', inset: '0' });
    const col = el('div', { position: 'absolute', left: `calc(31% + var(--u) * ${M})`,
      right: u(M), top: u(M), bottom: u(M), display: 'flex', flexDirection: 'column' });
    col.append(
      edit(ctx),
      disp(ctx, ctx.content.title, 9, { marginTop: u(2.5) }),
      disp(ctx, ctx.content.headline, 3.4, { marginTop: u(4) }),
      meta(ctx, ctx.content.metaA, { marginTop: u(5) }),
      meta(ctx, ctx.content.metaB, { marginTop: u(2.5) }),
      el('div', { flexGrow: '1' }),
      colo(ctx, { borderTop: `1px solid ${ctx.ink.ink}`, paddingTop: u(1.2) })
    );
    r.append(
      pic(ctx, { position: 'absolute', left: '0', top: '0', bottom: '0', width: '31%' }),
      col
    );
    return r;
  }},

  /* 6 — restraint: small image high-right, vast paper, title at extreme lower-left */
  { name: 'The Margin', render(ctx) {
    const r = el('div', { position: 'absolute', inset: '0' });
    r.append(
      pic(ctx, { position: 'absolute', top: u(M), right: u(M), width: u(24), height: u(30) }),
      meta(ctx, ctx.content.metaA, { position: 'absolute', top: u(M), left: u(M), fontSize: u(1.55) }),
      meta(ctx, ctx.content.metaB, { position: 'absolute', top: u(M + 32), right: u(M),
        textAlign: 'right', fontSize: u(1.55) }),
      edit(ctx, { position: 'absolute', left: u(M), top: '46%', writingMode: 'vertical-rl' }),
      disp(ctx, ctx.content.headline, 2.2, { position: 'absolute', right: u(M), bottom: u(8), textAlign: 'right' }),
      disp(ctx, ctx.content.title, 9.5, { position: 'absolute', left: u(M), bottom: u(8), maxWidth: '78%' }),
      colo(ctx, { position: 'absolute', left: u(M), bottom: u(2.6) })
    );
    return r;
  }},

  /* 7 — pure type, deliberately un-Swiss: centered declaration */
  { name: 'The Proclamation', render(ctx) {
    const c = el('div', { position: 'absolute', inset: u(M), display: 'flex',
      flexDirection: 'column', alignItems: 'center', textAlign: 'center' });
    const decl = el('div', { flexGrow: '1', display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'space-evenly',
      paddingTop: u(1), paddingBottom: u(4) });
    decl.append(
      edit(ctx, { letterSpacing: '0.32em', color: ctx.ink.accent }),
      disp(ctx, ctx.content.title, 9.5),
      meta(ctx, ctx.content.metaA, { lineHeight: '1.75',
        letterSpacing: '0.18em', textTransform: 'uppercase', fontSize: u(1.5) }),
      disp(ctx, ctx.content.headline, 4.6, { color: ctx.ink.accent }),
      meta(ctx, ctx.content.metaB, { lineHeight: '1.75',
        letterSpacing: '0.18em', textTransform: 'uppercase', fontSize: u(1.5) })
    );
    c.append(
      decl,
      el('div', { width: u(14), borderTop: `2px solid ${ctx.ink.ink}`, marginBottom: u(2) }),
      colo(ctx, { textAlign: 'center' })
    );
    return c;
  }},

  /* 8 — pure type: headline words fit to full sheet width */
  { name: 'The Wood Type', render(ctx) {
    const c = el('div', { position: 'absolute', inset: u(M), display: 'flex', flexDirection: 'column' });
    const top = el('div', { display: 'flex', justifyContent: 'space-between',
      alignItems: 'baseline', fontSize: u(1.6) });
    top.append(
      el('div', { fontWeight: '600', letterSpacing: '0.1em', textTransform: 'uppercase' },
        linesOf(ctx.content.title).join(' / ')),
      edit(ctx)
    );
    const words = el('div', { flexGrow: '1', minHeight: '0', overflow: 'hidden',
      display: 'flex', flexDirection: 'column', justifyContent: 'center',
      marginTop: u(2), marginBottom: u(2) });
    const list = String(ctx.content.headline || '').split(/\s+/).filter(s => s);
    list.forEach((wd, i) => {
      const d = el('div', {
        fontFamily: ctx.voice.display, fontWeight: ctx.voice.displayWeight,
        textTransform: 'uppercase', lineHeight: '0.92', letterSpacing: '-0.01em',
        color: i === 1 ? ctx.ink.accent : ctx.ink.ink,
      }, wd);
      d.dataset.fit = '1';
      words.append(d);
    });
    c.append(top, words, colo(ctx));
    return c;
  }},

  /* 9 — type-specimen: one giant glyph, precise meta grid around it */
  { name: 'The Ledger', render(ctx) {
    const glyph = (linesOf(ctx.content.title).join(' ').trim()[0] || 'A');
    const r = el('div', { position: 'absolute', inset: '0' });
    const top = el('div', { position: 'absolute', top: u(M), left: u(M), right: u(M),
      display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' });
    top.append(
      disp(ctx, linesOf(ctx.content.title).join(' / '), 2.2),
      edit(ctx, { fontFamily: ctx.voice.display, fontWeight: ctx.voice.displayWeight,
        fontSize: u(3), letterSpacing: '0' })
    );
    const mid = el('div', { position: 'absolute', inset: '0', display: 'flex',
      alignItems: 'center', justifyContent: 'center' });
    mid.append(el('div', {
      fontFamily: ctx.voice.display, fontWeight: ctx.voice.displayWeight,
      textTransform: ctx.voice.transform, fontSize: u(56), lineHeight: '1',
      color: ctx.ink.accent,
    }, glyph));
    r.append(
      mid, top,
      el('div', { position: 'absolute', top: u(12), left: u(M), right: u(M),
        borderTop: `1px solid ${ctx.ink.ink}` }),
      meta(ctx, ctx.content.metaA, { position: 'absolute', left: u(M), top: u(15), fontSize: u(1.55) }),
      meta(ctx, ctx.content.metaB, { position: 'absolute', right: u(M), top: u(15),
        textAlign: 'right', fontSize: u(1.55) }),
      meta(ctx, ctx.content.headline, { position: 'absolute', left: u(M), bottom: u(8), fontSize: u(1.9) }),
      colo(ctx, { position: 'absolute', left: u(M), right: u(M), bottom: u(2.6),
        borderTop: `1px solid ${ctx.ink.ink}`, paddingTop: u(1.2) })
    );
    return r;
  }},

  /* 10 — theatre-bill vertical, rules dividing sections */
  { name: 'The Bill', render(ctx) {
    const c = el('div', { position: 'absolute', inset: u(M), display: 'flex',
      flexDirection: 'column', textAlign: 'center' });
    const metas = el('div', { display: 'flex', padding: `${u(2)} 0` });
    metas.append(
      meta(ctx, ctx.content.metaA, { flex: '1', textAlign: 'center', fontSize: u(1.6) }),
      meta(ctx, ctx.content.metaB, { flex: '1', textAlign: 'center', fontSize: u(1.6),
        borderLeft: `1px solid ${ctx.ink.ink}` })
    );
    c.append(
      rule(ctx, true),
      el('div', { fontSize: u(1.6), letterSpacing: '0.35em', textTransform: 'uppercase',
        fontWeight: '600', padding: `${u(1.6)} 0`, color: ctx.ink.accent }, ctx.content.edition),
      rule(ctx),
      disp(ctx, ctx.content.title, 8.2, { padding: `${u(2.4)} 0`, textAlign: 'center' }),
      rule(ctx),
      disp(ctx, ctx.content.headline, 4, { padding: `${u(2.4)} 0`, textAlign: 'center',
        color: ctx.ink.accent }),
      rule(ctx),
      metas,
      rule(ctx),
      el('div', { flexGrow: '1' }),
      rule(ctx, true),
      colo(ctx, { textAlign: 'center', marginTop: u(1.5) })
    );
    return c;
  }},
];

/* =========================================================
   RENDER
   ========================================================= */

const wrap = document.getElementById('posterwrap');
const stage = document.getElementById('stage');

function ctxNow() {
  const ink = INKS[state.ink];
  return {
    content: state.content,
    voice: VOICES[state.voice],
    ink,
    image: state.image || placeholder(ink),
    ratio: RATIOS[state.ratio],
    W, H: dims().H,
  };
}

function renderPoster() {
  const { H } = dims();
  const ctx = ctxNow();
  const root = el('div', {
    position: 'relative', width: W + 'px', height: H + 'px',
    background: ctx.ink.paper, color: ctx.ink.ink,
    fontFamily: ctx.voice.text, overflow: 'hidden',
    '--u': (W / 100) + 'px',
  });
  root.id = 'poster';
  root.append(LAYOUTS[state.layout].render(ctx));
  wrap.replaceChildren(root);
  fitLines(root);
  scaleToFit();
  updateChrome();
}

// Fit-to-width sizing for elements flagged data-fit (The Wood Type).
// Pass 1: size each line so its glyphs span the full column width.
// Pass 2: if the stack overflows vertically, shrink all lines to fit,
// then stretch each line horizontally (scaleX) back to full width —
// the wood-type move: every line condensed or extended to fill the measure.
function fitLines(root) {
  const els = [...root.querySelectorAll('[data-fit]')];
  if (!els.length) return;
  const conts = new Set();
  for (const e of els) {
    const avail = e.parentElement.clientWidth;
    e.style.whiteSpace = 'nowrap';
    e.style.width = 'max-content';
    e.style.transform = 'none';
    e.style.fontSize = '100px';
    const w = e.scrollWidth;
    if (w > 0 && avail > 0) e.style.fontSize = ((100 * avail) / w).toFixed(2) + 'px';
    conts.add(e.parentElement);
  }
  for (const c of conts) {
    if (c.scrollHeight > c.clientHeight + 1) {
      const r = c.clientHeight / c.scrollHeight;
      for (const e of c.querySelectorAll('[data-fit]')) {
        e.style.fontSize = (parseFloat(e.style.fontSize) * r).toFixed(2) + 'px';
      }
    }
    const avail = c.clientWidth;
    for (const e of c.querySelectorAll('[data-fit]')) {
      const w = e.scrollWidth;
      if (w > 0 && w < avail - 1) {
        const s = Math.min(avail / w, 2.6);
        e.style.transformOrigin = 'left center';
        e.style.transform = `scaleX(${s.toFixed(3)})`;
      }
    }
  }
}

function scaleToFit() {
  const poster = document.getElementById('poster');
  if (!poster) return;
  const { H } = dims();
  const pad = 72;
  const s = Math.min((stage.clientWidth - pad) / W, (stage.clientHeight - pad) / H);
  poster.style.transform = `scale(${s})`;
  poster.style.transformOrigin = 'top left';
  wrap.style.width = (W * s) + 'px';
  wrap.style.height = (dims().H * s) + 'px';
}

function updateChrome() {
  document.getElementById('layoutLabel').innerHTML =
    `<span>${String(state.layout + 1).padStart(2, '0')} / ${String(LAYOUTS.length).padStart(2, '0')}</span>${LAYOUTS[state.layout].name}`;
  document.querySelectorAll('#layoutGrid button').forEach((b, i) =>
    b.classList.toggle('active', i === state.layout));
  document.querySelectorAll('#ratioSeg button').forEach((b, i) =>
    b.classList.toggle('active', i === state.ratio));
  document.querySelectorAll('#voiceList button').forEach((b, i) =>
    b.classList.toggle('active', i === state.voice));
  document.querySelectorAll('#inkList button').forEach((b, i) =>
    b.classList.toggle('active', i === state.ink));
  document.getElementById('imgNote').textContent = state.image
    ? 'Using your uploaded image. Pure-type layouts ignore it.'
    : 'No upload yet — using a generated placeholder in the active ink. Pure-type layouts ignore the image.';
}

/* =========================================================
   CONTROLS
   ========================================================= */

function buildControls() {
  const grid = document.getElementById('layoutGrid');
  LAYOUTS.forEach((l, i) => {
    const b = el('button', null, String(i + 1));
    b.type = 'button';
    b.title = l.name;
    b.onclick = () => { state.layout = i; renderPoster(); };
    grid.append(b);
  });

  const seg = document.getElementById('ratioSeg');
  RATIOS.forEach((r, i) => {
    const b = el('button', null, r.label);
    b.type = 'button';
    b.onclick = () => { state.ratio = i; renderPoster(); };
    seg.append(b);
  });

  const vl = document.getElementById('voiceList');
  VOICES.forEach((v, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    const name = el('div', { fontFamily: v.display, fontWeight: v.displayWeight });
    name.className = 'vname'; name.textContent = v.name;
    const sub = el('div'); sub.className = 'vsub';
    sub.textContent = v.displayLabel === v.textLabel
      ? v.displayLabel : `${v.displayLabel} + ${v.textLabel}`;
    const box = el('div', null, name, sub);
    b.append(box);
    b.onclick = () => { state.voice = i; renderPoster(); };
    vl.append(b);
  });

  const il = document.getElementById('inkList');
  INKS.forEach((k, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    const sw = el('div', { background: k.paper, color: k.ink });
    sw.className = 'swatch'; sw.textContent = 'Aa';
    const dot = document.createElement('i'); dot.style.background = k.accent;
    sw.append(dot);
    const nm = el('div'); nm.className = 'iname'; nm.textContent = k.name;
    b.append(sw, nm);
    b.onclick = () => { state.ink = i; renderPoster(); };
    il.append(b);
  });

  const FIELDS = [
    ['title', 'Title', 2], ['headline', 'Headline', 3],
    ['metaA', 'Meta Column A', 4], ['metaB', 'Meta Column B', 3],
    ['edition', 'Edition', 0], ['colophon', 'Colophon', 2],
  ];
  const ff = document.getElementById('fields');
  for (const [key, label, rows] of FIELDS) {
    const wrapF = el('div'); wrapF.className = 'field';
    const lb = el('label', null, label);
    let input;
    if (rows === 0) {
      input = document.createElement('input'); input.type = 'text';
    } else {
      input = document.createElement('textarea'); input.rows = rows;
    }
    input.value = state.content[key];
    input.addEventListener('input', () => { state.content[key] = input.value; renderPoster(); });
    wrapF.append(lb, input);
    ff.append(wrapF);
  }

  document.getElementById('imgInput').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { state.image = r.result; renderPoster(); };
    r.readAsDataURL(f);
  });
  document.getElementById('btnClearImg').onclick = () => {
    state.image = null;
    document.getElementById('imgInput').value = '';
    renderPoster();
  };

  const rand = (n, not) => {
    if (n < 2) return 0;
    let v; do { v = Math.floor(Math.random() * n); } while (v === not);
    return v;
  };
  const shuffle = () => { state.layout = rand(LAYOUTS.length, state.layout); renderPoster(); };
  document.getElementById('btnShuffle').onclick = shuffle;
  document.getElementById('btnShuffleSide').onclick = shuffle;
  document.getElementById('btnSurprise').onclick = () => {
    state.layout = rand(LAYOUTS.length, state.layout);
    state.voice = rand(VOICES.length, state.voice);
    state.ink = rand(INKS.length, state.ink);
    renderPoster();
  };
  document.getElementById('btnPrev').onclick = () => {
    state.layout = (state.layout + LAYOUTS.length - 1) % LAYOUTS.length; renderPoster();
  };
  document.getElementById('btnNext').onclick = () => {
    state.layout = (state.layout + 1) % LAYOUTS.length; renderPoster();
  };
  document.getElementById('btnExport').onclick = exportPNG;

  window.addEventListener('keydown', (e) => {
    const t = e.target.tagName;
    if (t === 'TEXTAREA' || t === 'INPUT') return;
    if (e.key === 'ArrowLeft') document.getElementById('btnPrev').click();
    if (e.key === 'ArrowRight') document.getElementById('btnNext').click();
  });

  window.addEventListener('resize', scaleToFit);
}

/* =========================================================
   EXPORT — SVG foreignObject → canvas, with web fonts
   embedded as data URLs so they rasterize correctly.
   ========================================================= */

let fontCSSPromise = null;
function getFontCSS() {
  if (!fontCSSPromise) {
    fontCSSPromise = (async () => {
      const href = document.getElementById('gfonts').href;
      const css = await (await fetch(href)).text();
      const blocks = css.match(/@font-face\s*\{[^}]*\}/g) || [];
      // keep latin subsets only (they cover the poster's character set)
      const latin = blocks.filter(b => /U\+0000/i.test(b));
      const urls = [...new Set(latin.flatMap(b =>
        [...b.matchAll(/url\((https:[^)]+)\)/g)].map(m => m[1])))];
      const map = {};
      await Promise.all(urls.map(async (u2) => {
        const blob = await (await fetch(u2)).blob();
        map[u2] = await new Promise((res) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.readAsDataURL(blob);
        });
      }));
      return latin.map(b =>
        b.replace(/url\((https:[^)]+)\)/g, (m, u3) => `url(${map[u3]})`)
      ).join('\n');
    })().catch(err => { fontCSSPromise = null; throw err; });
  }
  return fontCSSPromise;
}

function slug(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

async function exportPNG() {
  const btn = document.getElementById('btnExport');
  const prev = btn.textContent;
  btn.textContent = 'Rendering…';
  btn.disabled = true;
  try {
    const fontCSS = await getFontCSS();
    const poster = document.getElementById('poster');
    const clone = poster.cloneNode(true);
    clone.style.transform = 'none';
    clone.removeAttribute('id'); // page CSS (shadow) must not apply
    const { H } = dims();
    const xml = new XMLSerializer().serializeToString(clone);
    const css = `*{margin:0;padding:0;box-sizing:border-box}\n${fontCSS}`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W * EXPORT_SCALE}" height="${H * EXPORT_SCALE}" viewBox="0 0 ${W} ${H}"><style><![CDATA[${css}]]></style><foreignObject width="${W}" height="${H}">${xml}</foreignObject></svg>`;
    // data: URL (not blob:) — blob-URL SVGs with foreignObject taint the canvas
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error('SVG rasterization failed'));
      img.src = url;
    });
    await new Promise(r => setTimeout(r, 60)); // let embedded fonts settle
    const c = document.createElement('canvas');
    c.width = W * EXPORT_SCALE;
    c.height = H * EXPORT_SCALE;
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, 'image/png'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `broadside-${slug(LAYOUTS[state.layout].name)}-${slug(INKS[state.ink].name)}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (err) {
    console.error(err);
    alert('Export failed: ' + err.message + '\nIf you opened the file directly, try serving it locally (fonts need fetch access).');
  } finally {
    btn.textContent = prev;
    btn.disabled = false;
  }
}

/* =========================================================
   BOOT
   ========================================================= */

buildControls();
renderPoster();
// Re-render once webfonts arrive so fit-to-width sizing uses real metrics
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => renderPoster());
}
</script>
